# Use from another repository's .pre-commit-config.yaml; see examples/pre-commit-config.yaml.
- id: sqlguard-leakage
  name: sqlguard leakage check
  description: Fail when a training-set SQL query reads data not available at prediction time.
  entry: sqlguard leakage check
  language: python
  files: \.sql$
  require_serial: true
- id: sqlguard-leakage-dbt
  name: sqlguard leakage dbt
  description: Fail when a dbt training_set model, with its upstream models inlined, reads data not available at prediction time. Reads manifest.json from `dbt compile`; pass it with `--manifest`.
  entry: sqlguard leakage dbt
  language: python
  files: \.(sql|ya?ml)$
  pass_filenames: false
  require_serial: true
