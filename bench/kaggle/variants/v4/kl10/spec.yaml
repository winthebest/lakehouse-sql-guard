# Airbnb New User Bookings: one row per new user.
label_table: train_users
entity_keys: [id]
# Assumption: the prediction is made when the account is created; the data page says the
# task is to predict a new user's first booking destination and the split is by date.
prediction_ts: date_account_created
label_columns: [country_destination]
time_columns: {train_users: date_account_created}
static_tables: []
outcome_columns:
  - train_users.date_first_booking   # thread 17595: only filled for users who booked; empty in test
