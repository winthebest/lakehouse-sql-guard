# LeakageSpec for the synthetic churn world (bench/leakage/world.py).
label_table: labels
entity_keys: [user_id]
prediction_ts: label_ts
label_columns: [churned]
time_columns:
  events: event_ts
  user_stats: updated_at
availability_columns:
  events: ingested_at
# Both values follow from the world generator's parameters (see world.declared_spec_fields).
max_ingest_delay:
  events: 8 days
label_known_after: 14 days
static_tables: [entities]
outcome_columns:
  - user_outcomes.refund_after_churn
  - user_outcomes.days_to_churn
dialect: duckdb
