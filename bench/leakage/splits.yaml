# Template splits of the leakage benchmark.
#   spec: the LeakageSpec every query of the split is checked with (relative to this directory)
#   seen: true when the rules, weights or spec were developed while looking at the split. A split
#         written after the rules were frozen is `seen: false` until a result on it has been read
#         and the rules change again.
# `run` reads the in-sample splits from the pre-registration (`seen_splits`) when it has them,
# else from here.
splits:
  dev:
    spec: spec.yaml
    seen: true
  dev_v1b:
    spec: spec.yaml
    seen: true
  # Written by independent authors after the v2 rules were frozen, then read and fixed against.
  holdout_v2:
    spec: spec_holdout_v2.yaml
    seen: true
  # The next held-out set: written by new authors who never see holdout_v2. Its templates arrive
  # after the rules are frozen again; until then the directory is empty.
  holdout_v3:
    spec: spec_holdout_v3.yaml
    seen: false
