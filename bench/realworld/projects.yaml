# Projects checked in the real-world validation. Every project is cloned at the pinned commit into
# the git-ignored `.realworld/` directory; nothing of a project is committed here except short
# excerpts of MIT / Apache-2.0 code (with attribution) and our own notes.
#
# group `new`: selected by the pre-registered search (search-prereg.yaml, screening.csv). This is
#   the main evidence: nobody looked at these projects while the rules were developed.
# group `seen`: read during development; reported separately, labelled "seen during development".
#
# publish: `code` = short excerpts may be quoted with attribution (license file in the clone);
#          `aggregate_only` = no license, so the clone is used locally and only counts and our own
#          notes are published.
projects:
  - repo: DobleL2/dbt_churn_prediction
    group: new
    sha: 00b28eafc127754e68bf25d5a161d6954196f409
    default_branch: main
    license: none
    publish: aggregate_only
    dbt_subdir: "."
    screening_order: 3
