# Projects of the second search (round 2), pinned at screening. Selected by the pre-registered
# search in search-prereg.yaml (screening.csv); nobody looked at these projects while the rules were
# developed. Same fields as ../projects.yaml, group `round2`. Clones go in the git-ignored
# `.realworld/` directory like round 1; the loader is bench/realworld/checkout.py `load_projects`.
#
# publish: `code` = short excerpts may be quoted with attribution (license file in the clone);
#          `aggregate_only` = no license, so the clone is used locally and only counts and our own
#          notes are published.
# flags:   `no_documented_cutoff` = the project documents neither a prediction/cutoff time nor the
#          timing of its label (criterion added in round 2; the project is still admitted).
# compile: every project compiles with dbt-duckdb at the pinned commit, and every model the
#          training tables read has compiled SQL (checked with bench.realworld.checkout).
