# Spec for nathandxn/dbt_credit_risk_model (group: round2, no license) at the pinned commit of
# ../projects.yaml. Written from the model and column names and the yml of models/1_sources/base and
# models/2_modeling (the README is empty), before the checker ran on any round 2 project.
# Spec-writing rules: see ../../specs/DobleL2__dbt_churn_prediction.yaml.
# Cutoff documentation: none (flag no_documented_cutoff).
#
# Assumptions the project does not settle:
#   - The project has no prose documentation. The case table (source_base__cases) carries the
#     documented columns is_default (values 0 and 1) and model_group (train or test); the decision
#     date of the case, decision_date, is taken as the prediction time because the training table
#     exposes it as the date of each case and nothing else is dated. The project does not call it a
#     prediction time.
#   - The static feature table (source_static__0, joined on case_model_group_key) is declared static:
#     it has no time column. Whether its features were computed as of the decision date is not
#     documented, so this is an assumption.
#   - The case table is both the label spine and the only history (single-table case of the round 1
#     specs).
#   - The cases and static tables are the project's source-layer models over staged raw tables
#     (ephemeral staging models), so the source-layer models are the physical tables.
label_table: source_base__cases
entity_keys: [case_id]
prediction_ts: decision_date
label_columns: [is_default]
# One table is the spine and the history of every feature: placeholder entry that no model reads
# (the spec requires one temporal table; it changes no analysis).
time_columns:
  unused_placeholder_events: occurred_at
static_tables: [source_static__0]

realworld:
  training_sets: [modeling_case_default_prediction]
  meta:
    "model:source_base__cases": {role: label_spine}
    "model:source_static__0": {role: static}
  basis: |
    - modeling_case_default_prediction is the training table: its name ("case default prediction"), the
      train/test model_group and the is_default column; it is the only model in models/2_modeling.
    - source_base__cases.yml: case_id unique and not null; model_group accepted values train, test;
      is_default accepted values 0 and 1.
    - column lists: the case model's columns as selected by the training table, and the static model's
      columns as selected (prefixed static_ in the training table).
    - no availability column or ingestion delay is documented.
  not_training:
    source_base__cases, source_static__0, source_apply_prev__*: source-layer models
  schema:
    "model:source_base__cases":
      case_model_group_key: UNKNOWN
      case_id: UNKNOWN
      model_group: UNKNOWN
      is_default: UNKNOWN
      decision_date: UNKNOWN
      decision_month: UNKNOWN
      week_number: UNKNOWN
    "model:source_static__0":
      case_model_group_key: UNKNOWN
      actual_days_past_due_with_tolerance: UNKNOWN
