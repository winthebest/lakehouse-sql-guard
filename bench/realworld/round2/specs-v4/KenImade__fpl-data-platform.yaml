# Spec for KenImade/fpl-data-platform, transform/ subdirectory (group: round2, no license) at the
# pinned commit of ../projects.yaml. Written from the README, models/features/_features.yml,
# models/marts/_marts.yml, models/staging/_staging.yml and models/staging/_sources.yml, before the
# checker ran on any round 2 project.
# Spec-writing rules: see ../../specs/DobleL2__dbt_churn_prediction.yaml.
# Cutoff documentation: documented (`deadline_utc`: "FEATURES ARE LEFT OF THE DEADLINE, LABELS RIGHT OF
# IT"; the project asserts it with tests/no_post_deadline_leakage.sql).
#
# Assumptions the project does not settle:
#   - Two spines feed the matrix (a live one and a reconstructed historical one, "disjoint by
#     construction and unioned"). Only feat_player_fixture_spine, which the yml documents with its
#     primary label did_appear, is declared as the label spine and trusted; the historical spine is
#     inlined and checked as part of the training query.
#   - The upstream tables are declared by role from the yml: match and player-gameweek facts
#     (kickoff_utc) and the deadline snapshots (fct_player_snapshot) and our own captures
#     (stg_fpl_players, captured_at) are temporal; the deadline calendar, players and teams are static.
#     Their bronze sources declare no columns (every bronze column is TEXT), so the staging and mart
#     models are the physical tables.
#   - ingested_at / built_at columns exist but are not described as availability times: no
#     availability column or delay is declared. A column is typed TIMESTAMPTZ only where the staging
#     model casts it; snapshot_at and captured_at are not cast in the models read, so UNKNOWN.
#
# v4 additions: the types of captured_at (UTC datetime, bronze.py:15) and snapshot_at (the newest
# captured_at before a deadline, fct_deadline_snapshot.sql:41), which the earlier spec left UNKNOWN.
label_table: feat_player_fixture_spine
entity_keys: [player_id, match_id]
prediction_ts: deadline_utc
label_columns: [did_appear, gw_points, gw_bonus, gw_bps]
time_columns:
  fct_player_gw: kickoff_utc
  fct_team_fixture: kickoff_utc
  fct_player_snapshot: snapshot_at
  stg_fpl_players: captured_at
static_tables: [stg_gameweeks, stg_players, stg_teams]

realworld:
  training_sets: [feat_training_set]
  meta:
    "model:feat_player_fixture_spine": {role: label_spine}
    "model:fct_player_gw": {time_column: kickoff_utc}
    "model:fct_team_fixture": {time_column: kickoff_utc}
    "model:fct_player_snapshot": {time_column: snapshot_at}
    "model:stg_fpl_players": {time_column: captured_at}
    "model:stg_gameweeks": {role: static}
    "model:stg_players": {role: static}
    "model:stg_teams": {role: static}
  basis: |
    - feat_training_set is the training table: yml "The assembled matrix. One row per player per
      fixture they could have played in, with every feature and every label"; README "models trained
      on historical data" with "strict point-in-time guarantees".
    - labels: did_appear is "THE PRIMARY LABEL"; gw_points, gw_bonus, gw_bps are "gameweek-level
      label[s]"; minutes, played_60, goals, assists, xg, xa, saves and the other post-match columns
      are the match outcome of the same row (yml: "Nothing reads stg_player_gameweek_stats except as a
      label"). Only the four the yml calls labels are listed as label_columns; the others are outcome
      statistics of the same row that the yml does not call labels.
    - prediction time: deadline_utc, the gameweek deadline ("Everything in the point-in-time layer
      keys off deadline_utc - a capture is a valid feature source for gameweek N only if it predates
      N's deadline", stg_gameweeks).
    - stg_fpl_players: "Our own captures ... Grain is (captured_at, player_id)".
  not_training:
    feat_team_defence_training_set: second training table (team defence model); not run here
    mart_player_fixture_predictions, mart_player_gameweek_predictions: marts over model predictions
    feat_player_form, feat_player_load, feat_team_strength, feat_*_spine*: feature models (inlined)
