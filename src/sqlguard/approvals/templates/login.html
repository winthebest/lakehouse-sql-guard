{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<h1>Sign in</h1>
<p>This link was printed on the terminal of whoever started <code>sqlguard serve</code>. Signing in uses it up.</p>
<form method="post" action="{{ base }}/login">
  <input type="hidden" name="token" value="{{ token }}">
  <button type="submit" class="primary">Sign in</button>
</form>
{% endblock %}
