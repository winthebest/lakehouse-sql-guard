# Local Spark + Iceberg REST catalog + S3-compatible storage for the SparkIcebergAdapter demo.
#
#   docker compose -f docker/docker-compose.yml up -d --wait
#   docker/demo.sh
#   docker compose -f docker/docker-compose.yml down -v
#
# Everything binds to 127.0.0.1 and uses throwaway credentials: do not expose this stack.
# Versions are pinned. Iceberg 1.10.x is the first line that ships a Spark 4.0 runtime, and the
# Python client (extra `spark`, pyspark-client 4.0.x) talks to the Spark 4.0 Connect server.
#
# The object store is MinIO built by Chainguard, pinned by digest: the upstream minio/minio
# images are no longer published to Docker Hub. Swap in any S3-compatible server by changing the
# `minio` service; only the endpoint, credentials and the `warehouse` bucket matter.
name: sqlguard-demo

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
  AWS_REGION: us-east-1

services:
  minio:
    image: chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: create the `warehouse` bucket (a signed S3 PUT; 409 means it already exists).
  create-bucket:
    image: curlimages/curl:8.15.0
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            --aws-sigv4 'aws:amz:us-east-1:s3' --user admin:password http://minio:9000/warehouse) || code=000
          case "$$code" in 200|409) echo "bucket warehouse ready ($$code)"; exit 0;; esac
          sleep 2
        done
        echo "could not create the warehouse bucket" >&2
        exit 1

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/wh/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:8181:8181"

  # Spark 4.0 with the Iceberg runtime, served over Spark Connect so a plain Python client
  # (no JVM on the host) can drive it. The catalog is named `demo`.
  spark:
    image: apache/spark:4.0.5-scala2.13-java17-python3-ubuntu
    depends_on:
      - rest
    environment:
      <<: *s3-env
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.1,org.apache.iceberg:iceberg-aws-bundle:1.10.1
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      - --conf
      - spark.sql.catalog.demo=org.apache.iceberg.spark.SparkCatalog
      - --conf
      - spark.sql.catalog.demo.type=rest
      - --conf
      - spark.sql.catalog.demo.uri=http://rest:8181
      - --conf
      - spark.sql.catalog.demo.warehouse=s3://warehouse/wh/
      - --conf
      - spark.sql.catalog.demo.io-impl=org.apache.iceberg.aws.s3.S3FileIO
      - --conf
      - spark.sql.catalog.demo.s3.endpoint=http://minio:9000
      - --conf
      - spark.sql.catalog.demo.s3.path-style-access=true
      - --conf
      - spark.sql.session.timeZone=UTC
    ports:
      - "127.0.0.1:15002:15002"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15002"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

volumes:
  minio-data:
